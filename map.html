<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Skyrim Interactive Map — collaborative map with live-synced markers and routes for multiple users." />
<meta property="og:title" content="Skyrim Interactive Map" />
<meta property="og:description" content="Collaborative Skyrim map with live-synced markers and routes." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#1a110a" />
<title>Skyrim Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');

  :root {
    --parchment: #f4e4c1;
    --parchment-dark: #d4b483;
    --ink: #2c1810;
    --ink-light: #4a2e1a;
    --gold: #c8a84b;
    --gold-light: #e8c870;
    --dark-bg: #1a110a;
    --panel-bg: rgba(20, 12, 5, 0.92);
    --border: #6b4c2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
    background: var(--dark-bg);
    color: var(--parchment);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(180deg, #0d0805 0%, #1a110a 100%);
    border-bottom: 2px solid var(--gold);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    position: relative;
  }
  header::before, header::after {
    content: '✦';
    color: var(--gold);
    font-size: 18px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 22px;
    color: var(--gold-light);
    letter-spacing: 0.15em;
    text-shadow: 0 0 12px rgba(200,168,75,0.6);
    font-weight: normal;
    text-transform: uppercase;
    flex: 1;
    text-align: center;
  }

  /* ── Sync status chip ── */
  .sync-status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--parchment-dark);
    letter-spacing: 0.05em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .sync-dot.online   { background: #5dba5d; box-shadow: 0 0 5px #5dba5d88; }
  .sync-dot.offline  { background: #ba5d5d; }
  .sync-dot.local    { background: #888; }

  /* ── Layout ── */
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--panel-bg);
    border-right: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Tab bar ── */
  .tab-bar {
    display: flex;
    flex-shrink: 0;
    border-bottom: 2px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    padding: 8px 4px;
    background: transparent;
    border: none;
    color: var(--parchment-dark);
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }
  .tab-btn:hover { color: var(--parchment); background: rgba(200,168,75,0.07); }
  .tab-btn.active { color: var(--gold-light); border-bottom-color: var(--gold); }

  /* ── Tab panels ── */
  .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .tab-panel.active { display: flex; }
  .tab-panel-scroll {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .sidebar-section {
    padding: 10px 10px 6px;
    border-bottom: 1px solid rgba(107,76,42,0.4);
    flex-shrink: 0;
  }
  .sidebar-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
    display: block;
  }

  .marker-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }

  .marker-btn {
    background: rgba(107,76,42,0.25);
    border: 1px solid rgba(107,76,42,0.5);
    border-radius: 4px;
    padding: 6px 4px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    color: var(--parchment);
    font-size: 11px;
    line-height: 1.3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .marker-btn:hover { background: rgba(200,168,75,0.2); border-color: var(--gold); }
  .marker-btn.active {
    background: rgba(200,168,75,0.3);
    border-color: var(--gold-light);
    box-shadow: 0 0 8px rgba(200,168,75,0.3);
  }
  .marker-btn .sky-icon {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .marker-btn .sky-icon svg { width: 100%; height: 100%; }

  .action-btn {
    width: 100%;
    background: rgba(107,76,42,0.25);
    border: 1px solid rgba(107,76,42,0.5);
    border-radius: 4px;
    padding: 7px 8px;
    cursor: pointer;
    text-align: left;
    color: var(--parchment);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .action-btn:hover { background: rgba(200,168,75,0.2); border-color: var(--gold); }
  .action-btn.active {
    background: rgba(200,168,75,0.3);
    border-color: var(--gold-light);
    color: var(--gold-light);
  }
  .action-btn.danger:hover { background: rgba(160,40,40,0.3); border-color: #a02828; color: #ff8080; }

  /* Marker list */
  .marker-list { flex: 1; overflow-y: auto; }
  .marker-item {
    padding: 7px 10px;
    border-bottom: 1px solid rgba(107,76,42,0.2);
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: background 0.1s;
  }
  .marker-item:hover { background: rgba(200,168,75,0.1); }
  .marker-item .item-icon {
    display: inline-flex;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
  }
  .marker-item .item-icon svg { width: 100%; height: 100%; }
  .marker-item .item-name { flex: 1; color: var(--parchment); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .marker-item .item-del {
    opacity: 0;
    background: none;
    border: none;
    color: #ff6060;
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    line-height: 1;
    transition: opacity 0.1s;
  }
  .marker-item:hover .item-del { opacity: 1; }

  /* ── Map ── */
  #map {
    flex: 1;
    background: #0d0805;
  }

  /* Leaflet overrides */
  .leaflet-container { background: #0d0805; }
  .leaflet-control-zoom a {
    background: var(--panel-bg) !important;
    color: var(--gold) !important;
    border-color: var(--border) !important;
    font-size: 16px !important;
  }
  .leaflet-control-zoom a:hover { background: rgba(200,168,75,0.2) !important; }
  .leaflet-popup-content-wrapper {
    background: var(--panel-bg);
    border: 2px solid var(--gold);
    border-radius: 4px;
    color: var(--parchment);
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }
  .leaflet-popup-tip { background: var(--gold); }
  .leaflet-popup-close-button { color: var(--gold) !important; font-size: 18px !important; top: 6px !important; right: 8px !important; }

  /* ── Map marker shell ── */
  .sky-marker {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 2px solid;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }
  .sky-marker:hover { transform: scale(1.2); }
  .sky-marker svg { display: block; }

  /* ── Popup content ── */
  .popup-inner { padding: 4px 2px; min-width: 180px; }
  .popup-name {
    font-size: 14px;
    color: var(--gold-light);
    margin-bottom: 5px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .popup-name .p-icon {
    display: inline-flex;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
  }
  .popup-name .p-icon svg { width: 100%; height: 100%; }
  .popup-type {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--parchment-dark);
    margin-bottom: 6px;
  }
  .popup-note {
    font-size: 12px;
    color: var(--parchment);
    line-height: 1.5;
    border-top: 1px solid rgba(107,76,42,0.5);
    padding-top: 6px;
    margin-top: 4px;
    white-space: pre-wrap;
    max-height: 120px;
    overflow-y: auto;
  }
  .popup-actions { display: flex; gap: 6px; margin-top: 8px; }
  .popup-btn {
    flex: 1;
    padding: 4px;
    font-size: 11px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: rgba(107,76,42,0.3);
    color: var(--parchment);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.1s;
  }
  .popup-btn:hover { background: rgba(200,168,75,0.25); border-color: var(--gold); }
  .popup-btn.del { border-color: #7a2020; }
  .popup-btn.del:hover { background: rgba(160,40,40,0.3); color: #ff8080; }

  /* Path items */
  .path-item {
    padding: 7px 10px;
    border-bottom: 1px solid rgba(107,76,42,0.2);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .path-item:hover { background: rgba(200,168,75,0.1); }
  .path-item .item-del {
    opacity: 0;
    background: none;
    border: none;
    color: #ff6060;
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    transition: opacity 0.1s;
    margin-left: auto;
    line-height: 1;
  }
  .path-item:hover .item-del { opacity: 1; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 9000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: linear-gradient(180deg, #1e1008 0%, #130c04 100%);
    border: 2px solid var(--gold);
    border-radius: 6px;
    padding: 20px 22px;
    min-width: 320px;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.9);
    transform: translateY(-12px);
    transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h2 {
    font-size: 15px;
    color: var(--gold-light);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: normal;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal h2 .m-icon {
    display: inline-flex;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
  }
  .modal h2 .m-icon svg { width: 100%; height: 100%; }
  .modal label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 5px;
  }
  .modal input, .modal textarea {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 7px 9px;
    color: var(--parchment);
    font-family: inherit;
    font-size: 13px;
    margin-bottom: 12px;
    resize: vertical;
    transition: border-color 0.15s;
  }
  .modal input:focus, .modal textarea:focus {
    outline: none;
    border-color: var(--gold);
  }
  .modal textarea { min-height: 70px; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .modal-cancel {
    padding: 7px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--parchment-dark);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: all 0.1s;
  }
  .modal-cancel:hover { border-color: var(--parchment-dark); color: var(--parchment); }
  .modal-save {
    padding: 7px 20px;
    background: linear-gradient(180deg, #9a7a30 0%, #6b5220 100%);
    border: 1px solid var(--gold);
    border-radius: 3px;
    color: var(--gold-light);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.05em;
    transition: all 0.1s;
  }
  .modal-save:hover { background: linear-gradient(180deg, #b89040 0%, #8a6830 100%); }

  /* Status bar */
  .status-bar {
    position: fixed;
    bottom: 0; left: 220px; right: 0;
    background: rgba(13,8,5,0.9);
    border-top: 1px solid var(--border);
    padding: 5px 14px;
    font-size: 11px;
    color: var(--parchment-dark);
    letter-spacing: 0.05em;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .empty-msg {
    padding: 12px 10px;
    font-size: 11px;
    color: rgba(212,180,131,0.5);
    text-align: center;
    font-style: italic;
  }

  /* ── Filter / sort bar ── */
  .filter-bar {
    display: flex;
    gap: 5px;
    margin-bottom: 6px;
    align-items: center;
  }
  .filter-input {
    flex: 1;
    min-width: 0;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 4px 7px;
    color: var(--parchment);
    font-size: 11px;
    font-family: inherit;
  }
  .filter-input::placeholder { color: rgba(212,180,131,0.35); }
  .filter-input:focus { outline: none; border-color: var(--gold); }
  .sort-btn {
    background: rgba(107,76,42,0.25);
    border: 1px solid rgba(107,76,42,0.5);
    border-radius: 3px;
    color: var(--gold);
    font-size: 10px;
    padding: 4px 5px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    flex-shrink: 0;
    transition: all 0.1s;
  }
  .sort-btn:hover { background: rgba(200,168,75,0.2); border-color: var(--gold); }
  .sort-btn.active { background: rgba(200,168,75,0.25); }

  /* ── Type groups ── */
  .type-group { }
  .type-group-header {
    padding: 5px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    transition: background 0.1s;
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.08em;
    border-bottom: 1px solid rgba(107,76,42,0.15);
  }
  .type-group-header:hover { background: rgba(200,168,75,0.07); }
  .tg-icon {
    display: inline-flex;
    width: 14px; height: 14px;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .tg-icon svg { width: 100%; height: 100%; }
  .tg-label { flex: 1; }
  .tg-count {
    background: rgba(107,76,42,0.45);
    border-radius: 8px;
    padding: 0 5px;
    font-size: 9px;
    color: var(--parchment-dark);
  }
  .tg-arrow {
    font-size: 8px;
    color: rgba(212,180,131,0.5);
    transition: transform 0.15s;
    margin-left: 2px;
  }
  .tg-arrow.collapsed { transform: rotate(-90deg); }
  .tg-items.hidden { display: none; }
  .marker-item.grouped { padding-left: 20px; }

  /* ── List tab sections ── */
  .section-markers {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid rgba(107,76,42,0.4);
    padding: 10px 10px 6px;
  }
  .section-routes {
    flex-shrink: 0;
    padding: 10px 10px 6px;
    max-height: 40%;
    display: flex;
    flex-direction: column;
  }
  .list-scroll {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #routeList.list-scroll { max-height: 140px; }
  .section-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
    display: block;
    flex-shrink: 0;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Route color picker ── */
  .route-color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .color-swatches {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }
  .color-swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.1s;
    flex-shrink: 0;
  }
  .color-swatch:hover { transform: scale(1.2); }
  .color-swatch.selected {
    border-color: var(--parchment);
    transform: scale(1.15);
  }
  .color-picker-input {
    width: 28px;
    height: 28px;
    border: 2px solid var(--border);
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    background: none;
    flex-shrink: 0;
    transition: border-color 0.1s;
  }
  .color-picker-input::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .color-picker-input::-webkit-color-swatch { border: none; border-radius: 50%; }
  .color-picker-input.selected { border-color: var(--parchment); }
</style>
</head>

<body>

<header>
  <h1>The Elder Scrolls &mdash; Skyrim &mdash; Interactive Map</h1>
  <div class="sync-status" id="syncStatus">
    <div class="sync-dot local" id="syncDot"></div>
    <span id="syncLabel">Local</span>
  </div>
</header>

<div class="workspace">

  <aside class="sidebar" id="sidebar">

    <!-- ── Tab bar ── -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tabPlace" onclick="switchTab('place')">⚔ Place</button>
      <button class="tab-btn" id="tabList"  onclick="switchTab('list')">📜 List</button>
    </div>

    <!-- ── Place tab ── -->
    <div class="tab-panel active" id="panelPlace">
      <div class="tab-panel-scroll">
        <div class="sidebar-section">
          <span class="sidebar-label">Place Marker</span>
          <div class="marker-grid" id="markerTypes"></div>
        </div>
        <div class="sidebar-section">
          <span class="sidebar-label">Tools</span>
          <button class="action-btn" id="btnRoute" onclick="toggleRouteMode()">
            <span>🛣️</span> Draw Route
          </button>
          <button class="action-btn" id="btnFinishRoute" onclick="finishRoute()" style="display:none;">
            <span>✅</span> Finish Route
          </button>
          <button class="action-btn" id="btnCancelRoute" onclick="cancelRoute()" style="display:none;">
            <span>❌</span> Cancel Route
          </button>
        </div>
      </div>
    </div>

    <!-- ── List tab ── -->
    <div class="tab-panel" id="panelList">

      <!-- Markers -->
      <div class="section-markers">
        <span class="section-label">Markers (<span id="markerCount">0</span>)</span>
        <div class="filter-bar">
          <input class="filter-input" id="markerSearch" type="text" placeholder="Search…" oninput="onSearchInput()" />
          <button class="sort-btn" id="sortBtn" onclick="toggleSort()" title="Toggle sort order">A–Z</button>
        </div>
        <div id="markerList" class="list-scroll">
          <div class="empty-msg">No markers placed yet.</div>
        </div>
      </div>

      <!-- Routes -->
      <div class="section-routes">
        <span class="section-label">Routes (<span id="routeCount">0</span>)</span>
        <div id="routeList" class="list-scroll">
          <div class="empty-msg">No routes drawn yet.</div>
        </div>
      </div>

    </div>

  </aside>

  <div id="map"></div>

</div>

<div class="status-bar" id="statusBar" style="display:none;">
  <div class="status-dot"></div>
  <span id="statusMsg"></span>
</div>

<!-- Marker / Edit Modal -->
<div class="modal-overlay" id="markerModal">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <label for="mName">Name</label>
    <input id="mName" type="text" placeholder="e.g. Bleak Falls Barrow" maxlength="60" />
    <label for="mNote">Notes</label>
    <textarea id="mNote" placeholder="Add lore notes, quest hints, loot found…"></textarea>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-save" id="modalSaveBtn" onclick="saveMarker()">Place on Map</button>
    </div>
  </div>
</div>

<!-- Route Name Modal -->
<div class="modal-overlay" id="routeModal">
  <div class="modal">
    <h2>🛣️ Name This Route</h2>
    <label for="rName">Route Name</label>
    <input id="rName" type="text" placeholder="e.g. Path to Sovngarde" maxlength="60" />
    <label>Color</label>
    <div class="route-color-row">
      <div class="color-swatches" id="colorSwatches"></div>
      <input type="color" id="rColorPicker" class="color-picker-input" title="Custom color" />
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeRouteModal()">Cancel</button>
      <button class="modal-save" onclick="saveRoute()">Save Route</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
//  HOLD ARCHIVE SYNC
//  The Atlas runs inside a same-origin iframe in the Guard Command app. Rather
//  than talk to any external service, it mirrors its markers and routes up to
//  the host over postMessage. The host persists them to the shared hold database
//  and pushes other guards' edits back down, so every connected device sees the
//  same map. Opened standalone (no host), it simply works in local-only mode.
// ══════════════════════════════════════════════════════════════════════════════

// ── Marker type definitions ───────────────────────────────────────────────────
const MARKER_TYPES = [
  { id: 'city',         label: 'City',         svgKey: 'city',         color: '#e8c870', bg: '#2a1a05' },
  { id: 'bandits',      label: 'Bandits',      svgKey: 'bandits',      color: '#e05030', bg: '#280808' },
  { id: 'cave',         label: 'Cave',         svgKey: 'cave',         color: '#a09888', bg: '#1a120a' },
  { id: 'dungeon',      label: 'Dungeon',      svgKey: 'dungeon',      color: '#c090c0', bg: '#1a0a1a' },
  { id: 'monster',      label: 'Monster',      svgKey: 'monster',      color: '#d04020', bg: '#2a0805' },
  { id: 'animal',       label: 'Animal',       svgKey: 'animal',       color: '#90c070', bg: '#0a1a05' },
  { id: 'ruins',        label: 'Ruins',        svgKey: 'ruins',        color: '#c0a878', bg: '#1a150a' },
  { id: 'shrine',       label: 'Shrine',       svgKey: 'shrine',       color: '#70c0e0', bg: '#0a1520' },
  { id: 'camp',         label: 'Camp',         svgKey: 'camp',         color: '#d4a030', bg: '#1a140a' },
  { id: 'mine',         label: 'Mine',         svgKey: 'mine',         color: '#c09060', bg: '#180e04' },
  { id: 'standing',     label: 'Stones',       svgKey: 'standing',     color: '#a0b8a0', bg: '#0a120a' },
  { id: 'supernatural', label: 'Supernatural', svgKey: 'supernatural', color: '#a060e8', bg: '#120820' },
  { id: 'note',         label: 'Note',         svgKey: 'note',         color: '#e0c880', bg: '#1a160a' },
];

const ROUTE_COLORS = ['#c8a84b','#e07040','#70a0e0','#80c060','#c070c0','#60b0b0','#e0d060','#e07090','#60c0b0','#b08050'];
let selectedRouteColor = ROUTE_COLORS[0];

// ── Host bridge state ─────────────────────────────────────────────────────────
const EMBEDDED = window.parent !== window; // true when running inside the app
let applyingRemote = false;                // guard: don't echo host-applied edits back

// ── Data stores ───────────────────────────────────────────────────────────────
// keyed by Firebase push ID (string) or local generated ID
const markerData   = new Map(); // id → {type, name, note, lat, lng}
const markerLayers = new Map(); // id → LeafletMarker
const routeData    = new Map(); // id → {name, color, points:[{lat,lng}]}
const routeLayers  = new Map(); // id → LeafletPolyline

// ── UI / drawing state ────────────────────────────────────────────────────────
let map;
let activeType      = null;
let pendingLatLng   = null;
let editingId       = null;   // Firebase key or local ID of marker being edited
let routeMode       = false;
let routePoints     = [];     // [{latlng}] — in-progress drawing
let routePolyline   = null;   // in-progress drawing polyline
let routeColorIdx   = 0;

// ── Organizer state ───────────────────────────────────────────────────────────
let markerSort      = 'recent';  // 'recent' | 'alpha'
let markerSearch    = '';
const collapsedGroups = new Set();

// ── ID generation for offline mode ───────────────────────────────────────────
function genLocalId() {
  return '_' + Math.random().toString(36).slice(2, 12);
}

// ── Map init ──────────────────────────────────────────────────────────────────
const MAP_URL = 'https://static.moxtcontent.com/public/resource/ai/gen/16525d5a-57ff-402f-86fb-e667d64fa249.png';
const IMG_W = 4000, IMG_H = 4000;

document.addEventListener('DOMContentLoaded', () => {
  buildMarkerGrid();
  buildColorSwatches();

  map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2,
    maxZoom: 4,
    zoomSnap: 0.25,
    zoomDelta: 0.5,
    attributionControl: false,
    zoomControl: true,
  });

  const bounds = [[0,0],[IMG_H, IMG_W]];
  L.imageOverlay(MAP_URL, bounds).addTo(map);
  map.fitBounds(bounds);

  map.on('click', onMapClick);
  map.on('mousemove', onMapMove);

  if (EMBEDDED) {
    setSyncStatus('local', 'Syncing…');
    // Announce to the Guard Command host that the Atlas is ready. The host
    // replies with a 'map:init' message carrying the saved markers and routes.
    notifyHost({ type: 'map:ready' });
  } else {
    setSyncStatus('local', 'Local');
  }
});

// ── Sidebar marker grid ───────────────────────────────────────────────────────
function buildMarkerGrid() {
  const grid = document.getElementById('markerTypes');
  MARKER_TYPES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'marker-btn';
    btn.id = 'mbtn-' + t.id;
    btn.innerHTML = `<span class="sky-icon" style="color:${t.color}">${SVG[t.svgKey]}</span><span>${t.label}</span>`;
    btn.onclick = () => selectMarkerType(t.id);
    grid.appendChild(btn);
  });
}

function selectMarkerType(id) {
  if (routeMode) return;
  activeType = activeType === id ? null : id;
  document.querySelectorAll('.marker-btn').forEach(b => b.classList.remove('active'));
  if (activeType) {
    document.getElementById('mbtn-' + id)?.classList.add('active');
    map.getContainer().style.cursor = 'crosshair';
  } else {
    map.getContainer().style.cursor = '';
  }
}

// ── Map interaction ───────────────────────────────────────────────────────────
function onMapClick(e) {
  if (routeMode) { addRoutePoint(e.latlng); return; }
  if (!activeType) return;
  pendingLatLng = e.latlng;
  editingId = null;
  const t = MARKER_TYPES.find(x => x.id === activeType);
  document.getElementById('modalTitle').innerHTML =
    `<span class="m-icon" style="color:${t.color}">${SVG[t.svgKey]}</span> Place ${t.label}`;
  document.getElementById('mName').value = '';
  document.getElementById('mNote').value = '';
  document.getElementById('modalSaveBtn').textContent = 'Place on Map';
  document.getElementById('markerModal').classList.add('open');
  setTimeout(() => document.getElementById('mName').focus(), 150);
}

function onMapMove(e) {
  if (!routeMode || routePoints.length === 0) return;
  routePolyline.setLatLngs([...routePoints.map(p => p.latlng), e.latlng]);
}

// ── Marker modal ──────────────────────────────────────────────────────────────
function closeModal() {
  document.getElementById('markerModal').classList.remove('open');
  pendingLatLng = null;
  editingId = null;
}

document.getElementById('mName').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveMarker();
  if (e.key === 'Escape') closeModal();
});

function saveMarker() {
  const name = document.getElementById('mName').value.trim() || 'Unknown Location';
  const note = document.getElementById('mNote').value.trim();

  if (editingId !== null) {
    const existing = markerData.get(editingId);
    if (!existing) { closeModal(); return; }
    updateMarkerLayer(editingId, { ...existing, name, note });
    closeModal();
    return;
  }

  const data = {
    type: activeType,
    lat: pendingLatLng.lat,
    lng: pendingLatLng.lng,
    name,
    note,
  };

  createMarkerLayer(genLocalId(), data);
  closeModal();
}

// ── Marker layer management ───────────────────────────────────────────────────
function createMarkerLayer(id, data) {
  if (markerLayers.has(id)) return;
  const t = MARKER_TYPES.find(x => x.id === data.type);
  if (!t) return;
  const latlng = L.latLng(data.lat, data.lng);

  const icon = L.divIcon({
    html: `<div class="sky-marker" style="width:32px;height:32px;background:${t.bg};border-color:${t.color};color:${t.color};">
      <span style="display:flex;align-items:center;justify-content:center;width:20px;height:20px;">${SVG[t.svgKey]}</span>
    </div>`,
    className: '',
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -20],
  });

  const leaf = L.marker(latlng, { icon }).addTo(map);
  leaf.bindPopup(buildPopupContent(id, data), { maxWidth: 260 });
  leaf.on('popupopen', () => {
    document.getElementById('pop-edit-' + id)?.addEventListener('click', () => editMarker(id));
    document.getElementById('pop-del-' + id)?.addEventListener('click', () => deleteMarker(id));
  });

  markerData.set(id, data);
  markerLayers.set(id, leaf);
  renderLists();
  pushMapState();
  if (!applyingRemote) switchTab('list');
}

function updateMarkerLayer(id, data) {
  const leaf = markerLayers.get(id);
  if (!leaf) { createMarkerLayer(id, data); return; }
  markerData.set(id, data);
  leaf.setPopupContent(buildPopupContent(id, data));
  renderLists();
  pushMapState();
}

function removeMarkerLayer(id) {
  const leaf = markerLayers.get(id);
  if (!leaf) return;
  map.removeLayer(leaf);
  markerData.delete(id);
  markerLayers.delete(id);
  renderLists();
  pushMapState();
}

function buildPopupContent(id, data) {
  const t = MARKER_TYPES.find(x => x.id === data.type);
  return `<div class="popup-inner">
    <div class="popup-name">
      <span class="p-icon" style="color:${t.color}">${SVG[t.svgKey]}</span>
      ${escHtml(data.name)}
    </div>
    <div class="popup-type">${t.label}</div>
    ${data.note ? `<div class="popup-note">${escHtml(data.note)}</div>` : ''}
    <div class="popup-actions">
      <button class="popup-btn" id="pop-edit-${id}">✏️ Edit</button>
      <button class="popup-btn del" id="pop-del-${id}">🗑️ Delete</button>
    </div>
  </div>`;
}

function editMarker(id) {
  const data = markerData.get(id);
  if (!data) return;
  markerLayers.get(id)?.closePopup();
  editingId = id;
  pendingLatLng = L.latLng(data.lat, data.lng);
  const t = MARKER_TYPES.find(x => x.id === data.type);
  document.getElementById('modalTitle').innerHTML =
    `<span class="m-icon" style="color:${t.color}">${SVG[t.svgKey]}</span> Edit ${t.label}`;
  document.getElementById('mName').value = data.name;
  document.getElementById('mNote').value = data.note || '';
  document.getElementById('modalSaveBtn').textContent = 'Save Changes';
  document.getElementById('markerModal').classList.add('open');
  setTimeout(() => document.getElementById('mName').focus(), 150);
}

function deleteMarker(id) {
  removeMarkerLayer(id);
}

// ── Route drawing ─────────────────────────────────────────────────────────────
function toggleRouteMode() {
  routeMode = true;
  activeType = null;
  document.querySelectorAll('.marker-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btnRoute').style.display = 'none';
  document.getElementById('btnFinishRoute').style.display = '';
  document.getElementById('btnCancelRoute').style.display = '';
  routePoints = [];
  routePolyline = L.polyline([], {
    color: ROUTE_COLORS[routeColorIdx % ROUTE_COLORS.length],
    weight: 3,
    dashArray: '8 4',
    opacity: 0.85,
  }).addTo(map);
  map.getContainer().style.cursor = 'crosshair';
  showStatus('Route mode: click the map to add waypoints. Click "Finish Route" when done.');
}

function addRoutePoint(latlng) {
  routePoints.push({ latlng });
  routePolyline.setLatLngs(routePoints.map(p => p.latlng));
  L.circleMarker(latlng, {
    radius: 4,
    color: ROUTE_COLORS[routeColorIdx % ROUTE_COLORS.length],
    fillColor: '#1a110a',
    fillOpacity: 1,
    weight: 2,
    className: 'route-vertex',
  }).addTo(map);
  showStatus(`Route mode: ${routePoints.length} point${routePoints.length > 1 ? 's' : ''} placed. Keep clicking or "Finish Route".`);
}

function buildColorSwatches() {
  const container = document.getElementById('colorSwatches');
  const picker = document.getElementById('rColorPicker');
  container.innerHTML = '';
  ROUTE_COLORS.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (i === 0 ? ' selected' : '');
    sw.style.background = c;
    sw.title = c;
    sw.onclick = () => {
      selectedRouteColor = c;
      container.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      picker.classList.remove('selected');
    };
    container.appendChild(sw);
  });
  picker.value = ROUTE_COLORS[0];
  picker.oninput = () => {
    selectedRouteColor = picker.value;
    container.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    picker.classList.add('selected');
  };
}

function finishRoute() {
  if (routePoints.length < 2) {
    showStatus('Need at least 2 points to create a route. Keep clicking!');
    return;
  }
  // Pre-select the next auto color in the swatch row
  const autoColor = ROUTE_COLORS[routeColorIdx % ROUTE_COLORS.length];
  selectedRouteColor = autoColor;
  const swatches = document.querySelectorAll('.color-swatch');
  swatches.forEach(s => s.classList.remove('selected'));
  const matchIdx = ROUTE_COLORS.indexOf(autoColor);
  if (matchIdx >= 0 && swatches[matchIdx]) swatches[matchIdx].classList.add('selected');
  document.getElementById('rColorPicker').classList.remove('selected');

  document.getElementById('rName').value = '';
  document.getElementById('routeModal').classList.add('open');
  setTimeout(() => document.getElementById('rName').focus(), 150);
}

function closeRouteModal() {
  document.getElementById('routeModal').classList.remove('open');
}

document.getElementById('rName').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveRoute();
  if (e.key === 'Escape') closeRouteModal();
});

function saveRoute() {
  const name = document.getElementById('rName').value.trim() || 'Unnamed Route';
  const color = selectedRouteColor;
  const points = routePoints.map(p => ({ lat: p.latlng.lat, lng: p.latlng.lng }));

  // Remove in-progress drawing artifacts
  if (routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }
  map.eachLayer(l => { if (l.options?.className === 'route-vertex') map.removeLayer(l); });

  const data = { name, color, points };

  createRouteLayer(genLocalId(), data);

  routeColorIdx++;
  closeRouteModal();
  exitRouteMode();
}

function cancelRoute() {
  if (routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }
  map.eachLayer(l => { if (l.options?.className === 'route-vertex') map.removeLayer(l); });
  routePoints = [];
  exitRouteMode();
}

function exitRouteMode() {
  routeMode = false;
  document.getElementById('btnRoute').style.display = '';
  document.getElementById('btnFinishRoute').style.display = 'none';
  document.getElementById('btnCancelRoute').style.display = 'none';
  map.getContainer().style.cursor = '';
  hideStatus();
}

// ── Route layer management ────────────────────────────────────────────────────
function createRouteLayer(id, data) {
  if (routeLayers.has(id)) return;
  const latlngs = data.points.map(p => L.latLng(p.lat, p.lng));
  const poly = L.polyline(latlngs, {
    color: data.color,
    weight: 5,
    opacity: 0.85,
  }).addTo(map);
  poly.bindTooltip(escHtml(data.name), { permanent: false, direction: 'center', sticky: true });
  poly.on('click', function(e) {
    L.popup({ maxWidth: 220 })
      .setLatLng(e.latlng)
      .setContent(`
        <div class="popup-inner">
          <div class="popup-name" style="margin-bottom:8px;">
            <span style="color:${data.color};font-size:16px;line-height:1;">━</span>
            ${escHtml(data.name)}
          </div>
          <div class="popup-actions">
            <button class="popup-btn del" onclick="deleteRoute('${id}');this.closest('.leaflet-popup').remove()">🗑️ Delete Route</button>
          </div>
        </div>`)
      .openOn(map);
    L.DomEvent.stopPropagation(e);
  });
  routeData.set(id, data);
  routeLayers.set(id, poly);
  renderLists();
  pushMapState();
  if (!applyingRemote) switchTab('list');
}

function removeRouteLayer(id) {
  const poly = routeLayers.get(id);
  if (!poly) return;
  map.removeLayer(poly);
  routeData.delete(id);
  routeLayers.delete(id);
  renderLists();
  pushMapState();
}

function deleteRoute(id) {
  removeRouteLayer(id);
}

// ── Host archive sync bridge ──────────────────────────────────────────────────
// Mirror the map's state up to the Guard Command host (which persists it to the
// shared hold database) and accept pushes when another guard changes the map.
function notifyHost(msg) {
  if (!EMBEDDED) return;
  try { window.parent.postMessage(msg, location.origin); } catch (e) {}
}

// Plain, JSON-safe shapes for the database (Leaflet layer objects are dropped).
function serializeMarker(id, d) {
  return { id, type: d.type, lat: d.lat, lng: d.lng, name: d.name, note: d.note };
}
function serializeRoute(id, r) {
  return { id, name: r.name, color: r.color, points: (r.points || []).map(p => ({ lat: p.lat, lng: p.lng })) };
}

// Report the current map state up to the host so it can be saved and shared.
function pushMapState() {
  if (applyingRemote || !EMBEDDED) return; // don't echo host-applied changes back
  notifyHost({
    type: 'map:save',
    markers: [...markerData.entries()].map(([id, d]) => serializeMarker(id, d)),
    routes: [...routeData.entries()].map(([id, r]) => serializeRoute(id, r)),
  });
}

// Rebuild the whole map from host-provided data (initial load or a remote edit).
function loadMapState(savedMarkers, savedRoutes) {
  applyingRemote = true;
  try {
    [...markerLayers.keys()].forEach(id => removeMarkerLayer(id));
    [...routeLayers.keys()].forEach(id => removeRouteLayer(id));

    (savedMarkers || []).forEach(d => {
      createMarkerLayer(d.id, { type: d.type, lat: d.lat, lng: d.lng, name: d.name || '', note: d.note || '' });
    });
    (savedRoutes || []).forEach(d => {
      createRouteLayer(d.id, { name: d.name, color: d.color || ROUTE_COLORS[0], points: d.points || [] });
    });

    renderLists();
    setSyncStatus('online', 'Synced to Hold');
  } finally {
    applyingRemote = false;
  }
}

window.addEventListener('message', e => {
  if (e.origin !== location.origin) return; // only trust our own same-origin host
  const d = e.data;
  if (!d || (d.type !== 'map:init' && d.type !== 'map:update')) return;
  loadMapState(d.markers, d.routes);
});

// ── Render sidebar lists ──────────────────────────────────────────────────────
function renderLists() {
  const ml = document.getElementById('markerList');
  document.getElementById('markerCount').textContent = markerData.size;

  if (markerData.size === 0) {
    ml.innerHTML = '<div class="empty-msg">No markers placed yet.</div>';
  } else {
    const q = markerSearch.toLowerCase();
    const entries = [...markerData.entries()];

    if (q) {
      const filtered = entries.filter(([, d]) => d.name.toLowerCase().includes(q));
      ml.innerHTML = filtered.length === 0
        ? '<div class="empty-msg">No matches found.</div>'
        : filtered.map(([id, d]) => markerItemHtml(id, d, false)).join('');
    } else {
      const byType = new Map(MARKER_TYPES.map(t => [t.id, []]));
      entries.forEach(([id, d]) => byType.get(d.type)?.push([id, d]));
      if (markerSort === 'alpha') {
        byType.forEach(arr => arr.sort((a, b) => a[1].name.localeCompare(b[1].name)));
      }
      let html = '';
      MARKER_TYPES.forEach(t => {
        const items = byType.get(t.id);
        if (!items || items.length === 0) return;
        const collapsed = collapsedGroups.has(t.id);
        html += `<div class="type-group">
          <div class="type-group-header" onclick="toggleGroup('${t.id}')">
            <span class="tg-icon" style="color:${t.color}">${SVG[t.svgKey]}</span>
            <span class="tg-label">${t.label}</span>
            <span class="tg-count">${items.length}</span>
            <span class="tg-arrow${collapsed ? ' collapsed' : ''}">▼</span>
          </div>
          <div class="tg-items${collapsed ? ' hidden' : ''}">
            ${items.map(([id, d]) => markerItemHtml(id, d, true)).join('')}
          </div>
        </div>`;
      });
      ml.innerHTML = html;
    }
  }

  const rl = document.getElementById('routeList');
  document.getElementById('routeCount').textContent = routeData.size;

  if (routeData.size === 0) {
    rl.innerHTML = '<div class="empty-msg">No routes drawn yet.</div>';
  } else {
    rl.innerHTML = [...routeData.entries()].map(([id, r]) => `
      <div class="path-item" onclick="focusRoute('${id}')">
        <span style="color:${r.color};font-size:14px;flex-shrink:0;">━</span>
        <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(r.name)}</span>
        <button class="item-del" onclick="event.stopPropagation();deleteRoute('${id}')" title="Delete">✕</button>
      </div>`).join('');
  }
}

function markerItemHtml(id, d, grouped) {
  const t = MARKER_TYPES.find(x => x.id === d.type);
  return `<div class="marker-item${grouped ? ' grouped' : ''}" onclick="focusMarker('${id}')">
    ${grouped ? '' : `<span class="item-icon" style="color:${t.color}">${SVG[t.svgKey]}</span>`}
    <span class="item-name">${escHtml(d.name)}</span>
    <button class="item-del" onclick="event.stopPropagation();deleteMarker('${id}')" title="Delete">✕</button>
  </div>`;
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  document.getElementById('panel' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
}

// ── Organizer controls ────────────────────────────────────────────────────────
function onSearchInput() {
  markerSearch = document.getElementById('markerSearch').value;
  renderLists();
}

function toggleSort() {
  markerSort = markerSort === 'recent' ? 'alpha' : 'recent';
  const btn = document.getElementById('sortBtn');
  btn.textContent = markerSort === 'alpha' ? 'Recent' : 'A–Z';
  btn.classList.toggle('active', markerSort === 'alpha');
  renderLists();
}

function toggleGroup(typeId) {
  collapsedGroups.has(typeId) ? collapsedGroups.delete(typeId) : collapsedGroups.add(typeId);
  renderLists();
}

function focusMarker(id) {
  const data = markerData.get(id);
  const leaf = markerLayers.get(id);
  if (!data || !leaf) return;
  map.setView(L.latLng(data.lat, data.lng), Math.max(map.getZoom(), 1), { animate: true });
  setTimeout(() => leaf.openPopup(), 350);
}

function focusRoute(id) {
  const poly = routeLayers.get(id);
  if (!poly) return;
  map.fitBounds(poly.getBounds(), { padding: [40, 40], animate: true });
}

// ── Status bar ────────────────────────────────────────────────────────────────
function showStatus(msg) {
  document.getElementById('statusMsg').textContent = msg;
  document.getElementById('statusBar').style.display = 'flex';
}
function hideStatus() {
  document.getElementById('statusBar').style.display = 'none';
}

// ── Sync status chip ──────────────────────────────────────────────────────────
function setSyncStatus(state, label) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + state;
  document.getElementById('syncLabel').textContent = label;
}

// ── Utility ───────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
